<div class="range-picker-wrap">
  <div class="range-picker">
    @for (p of presets; track p) {
      <button
        class="range-btn"
        [class.active]="range.activeRange().preset === p"
        (click)="select(p)">
        {{ labels[p] }}
      </button>
    }
    <button
      class="range-btn range-btn-custom"
      [class.active]="range.activeRange().preset === 'custom'"
      (click)="openCustom()">
      📅 מותאם אישית
    </button>
  </div>

  <div class="range-display">מציג נתונים עבור: <span dir="ltr">{{ displayRange() }}</span></div>

  @if (customOpen) {
    <div class="custom-panel">
      <label>
        מתאריך
        <input type="date" [(ngModel)]="customFrom" />
      </label>
      <label>
        עד תאריך
        <input type="date" [(ngModel)]="customTo" />
      </label>
      <button class="custom-apply" (click)="applyCustom()">החל</button>
      <button class="custom-cancel" (click)="cancelCustom()">ביטול</button>
    </div>
  }
</div>
