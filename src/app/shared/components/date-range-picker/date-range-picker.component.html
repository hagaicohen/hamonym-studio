<div class="range-picker-wrap">
  <div class="range-picker" role="group" aria-label="בחירת טווח תאריכים">
    @for (p of presets; track p) {
      <button
        type="button"
        class="range-btn"
        [class.active]="range.activeRange().preset === p"
        [attr.aria-pressed]="range.activeRange().preset === p"
        (click)="select(p)">
        {{ labels[p] }}
      </button>
    }
    <button
      type="button"
      class="range-btn range-btn-custom"
      [class.active]="range.activeRange().preset === 'custom'"
      [attr.aria-pressed]="range.activeRange().preset === 'custom'"
      [attr.aria-expanded]="customOpen"
      (click)="openCustom()">
      <span class="range-calendar-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></span>מותאם אישית
    </button>
  </div>

  <div class="range-display">מציג נתונים עבור: <span dir="ltr">{{ displayRange() }}</span></div>

  @if (customOpen) {
    <div class="custom-panel">
      <label>
        מתאריך
        <input type="date" [(ngModel)]="customFrom" />
      </label>
      <label>
        עד תאריך
        <input type="date" [(ngModel)]="customTo" />
      </label>
      <button class="custom-apply" (click)="applyCustom()">החל</button>
      <button class="custom-cancel" (click)="cancelCustom()">ביטול</button>
    </div>
  }
</div>
