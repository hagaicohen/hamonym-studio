<div hidden><ng-content /></div>
<button #trigger class="dropdown-trigger" type="button" [disabled]="isDisabled" [class.dropdown-action-trigger]="actionMode"
        [id]="inputId || panelId + '-trigger'" [attr.aria-required]="required || null"
        [attr.aria-expanded]="open" [attr.aria-controls]="open ? panelId : null"
        [attr.aria-label]="label ? label + ': ' + caption : null" (click)="toggle()">
  <span>{{ caption }}</span>
  @if (!actionMode) {
  <svg class="dropdown-chevron" aria-hidden="true" viewBox="0 0 16 16" fill="none">
    <path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  }
</button>
@if (open) {
  <div class="dropdown-panel" #panel [id]="panelId" role="group" [attr.aria-label]="label || caption">
    @if (searchable) {
      <input class="dropdown-search" type="search" aria-label="חיפוש ברשימה" placeholder="חיפוש..."
             [value]="query" (input)="setQuery($any($event.target).value)">
    }
    <div class="dropdown-options">
      @for (item of visibleItems; track $index) {
        <button class="dropdown-option" type="button" [disabled]="item.disabled" [class.destructive]="item.destructive"
                [attr.aria-pressed]="actionMode ? null : isSelected(item)" (click)="choose(item)">
          <span class="dropdown-option-label">@if (item.icon) { <app-icon [name]="item.icon" /> }{{ item.name }}</span>
          @if (isSelected(item)) { <span class="dropdown-check" aria-hidden="true">✓</span> }
        </button>
      } @empty {
        @if (!statusMessage) { <p role="status">לא נמצאו אפשרויות</p> }
      }
      @if (statusMessage) { <p role="status">{{ statusMessage }}</p> }
      @if (more) {
        <button type="button" class="dropdown-option" (click)="moreRequested.emit()">הצגת אפשרויות נוספות</button>
      }
    </div>
  </div>
}
