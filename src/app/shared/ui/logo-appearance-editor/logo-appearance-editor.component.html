<div class="lae-row">
  <div class="lae-group">
    <span class="lae-label">{{ 'editors.ui.shape' | transloco }}</span>
    <button type="button" class="lae-btn" [class.active]="shape === 'circle'" (click)="setShape('circle')">{{ 'editors.ui.circle' | transloco }}</button>
    <button type="button" class="lae-btn" [class.active]="shape === 'square'" (click)="setShape('square')">{{ 'editors.ui.square' | transloco }}</button>
    <button type="button" class="lae-btn" [class.active]="shape === 'none'" (click)="setShape('none')">{{ 'editors.ui.noShape' | transloco }}</button>
  </div>

  <div class="lae-group">
    <span class="lae-label">{{ 'editors.ui.size' | transloco }}</span>
    <button type="button" class="lae-btn" [class.active]="size === 'sm'" (click)="setSize('sm')">{{ 'editors.ui.small' | transloco }}</button>
    <button type="button" class="lae-btn" [class.active]="size === 'md'" (click)="setSize('md')">{{ 'editors.ui.medium' | transloco }}</button>
    <button type="button" class="lae-btn" [class.active]="size === 'lg'" (click)="setSize('lg')">{{ 'editors.ui.large' | transloco }}</button>
  </div>

  <app-color-picker
    [value]="background"
    [showNone]="true"
    (valueChange)="setBackground($event)"
    [label]="'editors.ui.logoBackground' | transloco">
  </app-color-picker>
</div>

<div class="lae-row" *ngIf="showBorder">
  <div class="lae-group">
    <span class="lae-label">{{ 'editors.ui.frame' | transloco }}</span>
    <app-color-picker
      [value]="borderColor"
      [showNone]="true"
      (valueChange)="setBorderColor($event)">
    </app-color-picker>
    <button type="button" class="lae-btn" [class.active]="(borderStyle || 'solid') === 'solid'" (click)="setBorderStyle('solid')">{{ 'editors.ui.solidLine' | transloco }}</button>
    <button type="button" class="lae-btn" [class.active]="borderStyle === 'dashed'" (click)="setBorderStyle('dashed')">{{ 'editors.ui.dashed' | transloco }}</button>
  </div>

  <div class="lae-group lae-group--slider">
    <span class="lae-label">{{ 'editors.ui.widthBorderwidthPx' | transloco: { borderWidth: (borderWidth) } }}</span>
    <input type="range" class="lae-slider" min="0" max="10" step="1" [value]="borderWidth" (input)="onBorderWidthInput($event)">
  </div>
</div>
