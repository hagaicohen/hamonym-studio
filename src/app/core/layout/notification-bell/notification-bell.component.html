<div class="bell-wrapper" *ngIf="count > 0 || dropdownOpen">
  <div class="bell-btn-wrap">
    <button class="bell-btn" type="button" title="הודעות" (click)="toggle($event)">
      <span class="bell-icon" [class.bell-icon--ring]="count > 0">🔔</span>
      <span class="bell-badge" *ngIf="count > 0">{{ count }}</span>
    </button>

    <div class="bell-dropdown" *ngIf="dropdownOpen">
      <div class="bell-dropdown-title">הודעות</div>

      <!-- ADMIN MODE — each notification kind is its own row, linking to
           the organizations list filtered by the matching real status.
           Kept as separate rows (not one merged count) since "ממתינות
           לאישור" and "פרטים חסרים" need different admin actions. -->
      <ng-container *ngIf="ctx.adminMode(); else entityItems">
        <div class="bell-empty" *ngIf="count === 0">אין הודעות חדשות</div>

        <div class="bell-item bell-item--link" *ngIf="pendingReviewCount > 0" (click)="goToOrganizations('pending_review', $event)">
          <span class="bell-item-icon">🕒</span>
          <div class="bell-item-body">
            <div class="bell-item-title">{{ pendingReviewCount }} עמותות ממתינות לאישור</div>
          </div>
        </div>

        <div class="bell-item bell-item--link" *ngIf="incompleteDraftsCount > 0" (click)="goToOrganizations('draft', $event)">
          <span class="bell-item-icon">📝</span>
          <div class="bell-item-body">
            <div class="bell-item-title">{{ incompleteDraftsCount }} עמותות עם פרטים חסרים</div>
          </div>
        </div>
      </ng-container>

      <!-- ENTITY-MANAGER MODE — dropdown listing unread admin decisions -->
      <ng-template #entityItems>
        <div class="bell-empty" *ngIf="notifications.length === 0">אין הודעות חדשות</div>

        <div class="bell-item" *ngFor="let n of notifications">
          <span class="bell-item-icon">✉️</span>
          <div class="bell-item-body">
            <div class="bell-item-title">{{ actionLabels[n.action] }}</div>
            <div class="bell-item-notes" *ngIf="n.notes">{{ n.notes }}</div>
            <div class="bell-item-meta">{{ n.actorName }} · {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</div>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
