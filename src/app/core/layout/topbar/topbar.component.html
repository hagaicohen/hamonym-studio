<header class="topbar">

  <!-- RIGHT: mobile menu + logo -->
  <div class="topbar-right">
    <button *ngIf="!publicPage" type="button" [attr.aria-label]="'shell.topbar.openNavigationMenu' | transloco" class="topbar-icon-btn mobile-menu-btn" (click)="menuClick.emit()">
      <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 17.25h16.5" />
      </svg>
    </button>
    <div class="brand">
      <img src="/logo.png" alt="Hamonym Logo" class="brand-logo" />
    </div>
  </div>

  <div class="topbar-left">
    <app-notification-bell *ngIf="authenticated && !publicPage"></app-notification-bell>
    <hm-language-switcher *ngIf="authenticated"></hm-language-switcher>
    <app-account-menu [publicPage]="publicPage" />
  </div>
</header>
