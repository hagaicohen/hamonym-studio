<!-- src/app/core/layout/app-layout/app-layout.component.html -->
<div class="app-shell">
  <app-idle-warning-modal></app-idle-warning-modal>

  <!-- Banner + topbar move as a single fixed unit -- see
       AppLayoutComponent's ResizeObserver, which measures this element's
       real height into --header-height instead of any hardcoded offset. -->
  <div class="fixed-header" #fixedHeader>
    <app-impersonation-banner></app-impersonation-banner>
    <app-topbar (menuClick)="toggleSidebar()"></app-topbar>
  </div>

  <!-- MOBILE OVERLAY -->

  <div
    class="mobile-overlay"
    [class.open]="mobileSidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <!-- BODY -->

  <div class="app-body">
    <!-- SIDEBAR -->

    <app-sidebar
      [mobileOpen]="mobileSidebarOpen"
      (closeMobile)="closeSidebar()"
    >
    </app-sidebar>

    <!-- CONTENT -->

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
