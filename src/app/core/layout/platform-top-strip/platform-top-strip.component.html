<!-- logo-hamonym-mark.svg is the exact, unmodified icon+wordmark SVG from the
     real old Hamonym platform's own strip (view-source, 2026-09-28) — not a
     derived/cropped asset, the genuine dedicated mark, no tagline baked in.
     .pts-inner is a FIXED platform-level container (1200px), deliberately
     independent of whatever content-column width the specific page format
     below it uses (1200px for the full campaign, ~460px for the minimal
     donation card) — the platform's own branding container must never be
     dictated by a narrow donation page. Right: Hamonym's own home link.
     Left: Facebook + account access, grouped in .pts-left (Facebook stays
     the outermost/edge element exactly as before; login is the new sibling
     inserted before it in DOM, which in this RTL flex context renders it
     just inside Facebook, closer to center, not past it). -->
<div class="pts-strip">
  <div class="pts-inner">
    <a class="pts-home" href="https://hamonym.com/" aria-label="המונים - מעבר לאתר הראשי">
      <img class="pts-logo" src="/logo-hamonym-mark.svg" alt="המונים">
    </a>
    <div class="pts-left">
      <!-- Account access lives here, not in the campaign nav below — it's a
           platform/account action, not a campaign action (2026-09-28).
           Hidden on the narrow mobile breakpoint (see .css) — the platform
           strip stays minimal branding there; account access is reachable
           from the campaign header's own mobile drawer instead. -->
      <button type="button" class="pts-login" (click)="goToAccount()">
        כניסה / אזור אישי
      </button>
      <a class="pts-fb" href="https://facebook.com/hamonym" target="_blank" rel="noopener" aria-label="עמוד הפייסבוק של המונים">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M22 12.07C22 6.48 17.52 2 12 2S2 6.48 2 12.07c0 5.02 3.66 9.18 8.44 9.93v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.9h-2.34V22c4.78-.75 8.44-4.91 8.44-9.93z"></path>
        </svg>
      </a>
    </div>
  </div>
</div>
