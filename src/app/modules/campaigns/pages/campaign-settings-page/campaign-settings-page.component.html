<div class="csp-shell">
  <p class="csp-loading" *ngIf="loading">טוען…</p>

  <ng-container *ngIf="!loading && draft as d">
    <div class="csp-main">
      <button type="button" class="csp-back" (click)="back()">→ חזרה לסקירה כללית</button>
      <div class="csp-title-row">
        <h1 class="csp-title">⚙️ הגדרות קמפיין</h1>
      </div>
      <p class="csp-subtitle">{{ d.title }} · כל שינוי נשמר אוטומטית</p>

      <div class="csp-panel">
        <div class="csp-row">
          <label class="csp-label">🎯 יעד גיוס (₪)</label>
          <input class="csp-input" type="text" inputmode="numeric"
            [ngModel]="formatMoney(d.targetAmount)" (change)="patchTarget($any($event.target).value)">
        </div>

        <div class="csp-row">
          <label class="csp-label">📍 מיקום הקמפיין</label>
          <div class="csp-location-types">
            <button type="button" *ngFor="let opt of LOCATION_TYPES"
              class="csp-location-btn" [class.active]="d.layout.campaignLocation?.type === opt.type"
              (click)="setLocationType(opt.type)">
              {{ opt.label }}
            </button>
          </div>
          <input *ngIf="d.layout.campaignLocation?.type === 'region' || d.layout.campaignLocation?.type === 'custom'"
            class="csp-input" type="text" maxlength="40"
            [ngModel]="d.layout.campaignLocation?.label || ''"
            (change)="setLocationLabel($any($event.target).value)"
            [placeholder]="d.layout.campaignLocation?.type === 'region' ? 'לדוגמה: בית שמש והסביבה' : 'לדוגמה: יישובי עוטף עזה'">
          <button *ngIf="d.layout.campaignLocation" type="button" class="csp-location-clear" (click)="clearLocation()">
            ✕ ללא מיקום
          </button>
          <p class="csp-note" *ngIf="!d.layout.campaignLocation">רשות — מוצג כתגית על ה-Hero כשמוגדר.</p>
        </div>

        <div class="csp-row csp-row--pair" *ngIf="!isOngoing">
          <div>
            <label class="csp-label">📅 תאריך התחלה</label>
            <input class="csp-input" type="date" [ngModel]="d.startDate" (change)="patchDate('startDate', $any($event.target).value)">
          </div>
          <div>
            <label class="csp-label">📅 תאריך סיום</label>
            <input class="csp-input" type="date" [ngModel]="d.endDate" (change)="patchDate('endDate', $any($event.target).value)">
          </div>
        </div>
        <p class="csp-note" *ngIf="isOngoing">קמפיין מתמשך — ללא תאריך סיום.</p>

        <div class="csp-setup">
          <span class="csp-setup-label">פרטי קמפיין (נדיר לשינוי)</span>

          <div class="csp-row">
            <label class="csp-label">שם קמפיין</label>
            <input class="csp-input" type="text" [ngModel]="d.title" (change)="patchText('title', $any($event.target).value)">
          </div>

          <div class="csp-row">
            <label class="csp-label">קטגוריה</label>
            <select class="csp-input" [ngModel]="d.category" (change)="patchText('category', $any($event.target).value)">
              <option value="">— ללא קטגוריה —</option>
              <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.label }}</option>
            </select>
          </div>

          <div class="csp-row">
            <label class="csp-label">שם מנהל</label>
            <input class="csp-input" type="text" [ngModel]="d.managerName" (change)="patchText('managerName', $any($event.target).value)">
          </div>

          <div class="csp-row">
            <label class="csp-label">כתובת (Slug)</label>
            <input class="csp-input csp-input--readonly" type="text" [value]="d.slug" readonly
              title="שינוי כתובת שובר קישורים משותפים קיימים — לא ניתן לעריכה כאן">
            <p class="csp-note">🔒 לא ניתן לשינוי — הכתובת כבר משותפת (קישורים, פרסומים), ושינוי שלה ישבור אותם.</p>
          </div>
        </div>

        <div class="csp-save-bar">
          <button type="button" class="csp-save-btn" [disabled]="saving" (click)="saveNow()">
            {{ saving ? 'שומר...' : '💾 שמור שינויים' }}
          </button>
          <span class="csp-status csp-status--saved" *ngIf="saved && !saving">✓ נשמר בהצלחה</span>
          <span class="csp-status csp-status--error" *ngIf="saveError && !saving">{{ saveError }}</span>
        </div>
      </div>
    </div>
  </ng-container>
</div>
