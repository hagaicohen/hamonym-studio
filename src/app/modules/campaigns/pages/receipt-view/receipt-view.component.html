<main class="official-receipt" dir="rtl">
  <h1>קבלה רשמית</h1>
  @if (loading) { <p role="status">טוען קבלה…</p> }
  @else if (pdfUrl) {
    <a [href]="downloadUrl" download="cardcom-receipt.pdf">הורדת הקבלה</a>
    <iframe [src]="pdfUrl" title="הקבלה הרשמית של CardCom"></iframe>
  } @else {
    <p role="status">{{ loginRequired ? 'יש להתחבר לחשבון ולאמת בעלות על הדוא״ל כדי לצפות בקבלה.' : 'הקבלה טרם זמינה' }}</p>
    @if (loginRequired) { <a routerLink="/login" [queryParams]="{returnUrl: returnUrl}">כניסה להמונים</a> }
    @else { <button type="button" (click)="load()">בדוק שוב</button> }
  }
  <a routerLink="/my-donations">התרומות שלי</a>
</main>
