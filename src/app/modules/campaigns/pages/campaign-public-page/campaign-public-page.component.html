<app-platform-top-strip [manageCampaignId]="canEdit ? (state.draft.id ?? null) : null" />

@if (notFound) {
  <div class="public-not-found">
    <p>הקמפיין לא נמצא</p>
  </div>
} @else if (!isLoading) {

  @if (ownerPreview) {
    <!-- Lightweight preview-status indication only (2026-10-06) — NOT a
         management bar: "ניהול הקמפיין" in the Platform Top Strip above is
         now the only management affordance, so this never needs its own
         Edit action, just enough to tell the manager this campaign isn't
         publicly visible yet. -->
    <div class="owner-preview-bar">
      <span>🔒 תצוגה מקדימה — הקמפיין עדיין אינו מפורסם לציבור (העמותה ממתינה לאישור)</span>
    </div>
  }

  @if (isAmbassadorMode && currentAmbassador) {
    <div class="ambassador-edit-bar">
      <span class="ambassador-edit-label">אתה צופה בדף השגריר שלך</span>
      <button class="ambassador-edit-btn" (click)="editMyAmbassadorPage()">
        ✏️ ערוך הדף שלי
      </button>
    </div>
  }

  <div class="public-preview-wrap">
    @if (isMinimalFormat) {
      <app-minimal-donation-page [ambassador]="currentAmbassador" />
    } @else {
      <app-campaign-preview [ambassador]="currentAmbassador" [ambassadorsList]="ambassadorsList" [autoOpenJoin]="autoOpenJoin" [isPublicPage]="true" />
    }
  </div>
}

<app-payment-failed-popup
  *ngIf="showFailedPopup"
  (retry)="onRetryPayment()"
  (closed)="showFailedPopup = false">
</app-payment-failed-popup>

<app-donation-toast />
