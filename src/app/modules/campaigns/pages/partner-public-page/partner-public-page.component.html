<div class="ppp-load-state" *ngIf="loading">טוען...</div>

<div class="ppp-load-state ppp-load-state--error" *ngIf="loadErrorMessage">⚠ {{ loadErrorMessage }}</div>

<ng-container *ngIf="!loading && !loadErrorMessage">

  <div class="ppp-edit-bar" *ngIf="canEdit">
    <span class="ppp-edit-label">אתה צופה בדף הציבורי של השותף שלך</span>
    <button class="ppp-edit-btn" type="button" (click)="goToEdit()">✏️ חזרה לעריכה</button>
  </div>

  <div class="ppp-back-bar" *ngIf="campaignSlug">
    <a class="ppp-back-link" [routerLink]="['/campaigns', campaignSlug, 'view']">
      ← חזרה ל{{ campaignTitle ? '"' + campaignTitle + '"' : 'קמפיין' }}
    </a>
  </div>

  <!-- Campaign banner — same image/title/logo as the campaign's own public
       page, pulled live (not authored per-partner). Identical for every
       partner in this campaign. -->
  <div class="ppp-campaign-banner" *ngIf="campaignSlug && campaignCoverImageUrl" [style.backgroundImage]="'url(' + campaignCoverImageUrl + ')'">
    <div class="ppp-campaign-banner-scrim"></div>
    <img *ngIf="campaignEntityLogo" [src]="campaignEntityLogo" alt="" class="ppp-campaign-banner-logo" />
    <span class="ppp-campaign-banner-title">{{ campaignTitle }}</span>
  </div>

  <app-campaign-preview />

  <div class="ppp-partner-nav" *ngIf="prevPartner || nextPartner">
    <a class="ppp-partner-nav-link ppp-partner-nav-link--prev" *ngIf="prevPartner"
      [routerLink]="['/partners', prevPartner.id, 'view']"
      [queryParams]="{ campaignSlug, campaignTitle }">
      <span class="ppp-partner-nav-label">השותף הקודם</span>
      <span class="ppp-partner-nav-name">{{ prevPartner.displayName }}</span>
    </a>
    <span class="ppp-partner-nav-spacer" *ngIf="!prevPartner"></span>
    <a class="ppp-partner-nav-link ppp-partner-nav-link--next" *ngIf="nextPartner"
      [routerLink]="['/partners', nextPartner.id, 'view']"
      [queryParams]="{ campaignSlug, campaignTitle }">
      <span class="ppp-partner-nav-label">השותף הבא</span>
      <span class="ppp-partner-nav-name">{{ nextPartner.displayName }}</span>
    </a>
  </div>

</ng-container>
