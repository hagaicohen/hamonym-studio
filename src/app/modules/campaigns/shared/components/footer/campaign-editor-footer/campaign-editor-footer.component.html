<div class="footer">
  <button
    type="button"
    class="secondary-button"
    (click)="previous.emit()"
    [disabled]="currentStep === 1 || isSaving"
  >
    הקודם
  </button>

  <!-- Hidden only on the last step (Publish), which has its own dedicated
       button — every other step, including the last content step before
       Publish, needs a way to move forward. -->
  @if (currentStep < totalSteps) {
    <button
      type="button"
      class="primary-button"
      (click)="next.emit()"
      [disabled]="!canContinue || isSaving">
      @if (isSaving) {
        <span class="btn-spinner"></span>
      } @else {
        המשך
      }
    </button>
  }
</div>
