@if (draft$ | async; as draft) {
  <app-ambassador-form-drawer [title]="editing ? 'עריכת הדף שלי' : 'הצטרפות כשגריר/ה'"
    [accent]="primaryColor(draft)" [busy]="joinStatus === 'loading' || photoUploading" (dismissed)="closeJoinModal()">
    @if (joinStatus === 'success') {
      <div class="hm-join-success">
        <h4 class="hm-join-success-title">הצטרפתם כשגרירים</h4>
        <p class="hm-join-success-sub">הקישור האישי שלכם מוכן</p>
        <div class="hm-join-link-box">
          <span class="hm-join-link-text">{{ joinShareUrl }}</span>
          <button class="hm-join-copy-btn" [style.background]="primaryColor(draft)" (click)="copyJoinLink()">
            {{ joinCopied ? 'הועתק' : 'העתקה' }}
          </button>
        </div>
      </div>
    } @else if (!auth.currentUser()) {
      <p>כדי להצטרף כשגריר יש להתחבר לחשבון.</p>
      <a [routerLink]="['/login']" [queryParams]="{ returnUrl: loginReturnUrl }">התחברות</a>
    } @else {
      <app-ambassador-form-fields [model]="joinForm" [identityOnly]="true" [editingId]="editing?.id"
        [savedSlug]="editing?.slug" [photoUrl]="editing?.photoUrl || auth.currentUser()?.picture"
        [campaignTitle]="draft.title" [campaignSlug]="draft.slug ?? ''" [target]="draft.targetAmount" [disabled]="joinStatus === 'loading'"
        (availabilityChange)="joinSlugAvailable = $event" (photoBusy)="photoUploading = $event" />
      @if (joinError) { <p class="hm-join-error" role="alert">{{ joinError }}</p> }
    }
    <button drawer-action type="button" [disabled]="joinStatus === 'loading' || photoUploading" (click)="closeJoinModal()">
      {{ joinStatus === 'success' ? 'סגירה' : 'ביטול' }}
    </button>
    <button drawer-action="primary" type="button" [hidden]="!auth.currentUser() || joinStatus === 'success'"
      [disabled]="!joinForm.fullName.trim() || joinStatus === 'loading' || !joinSlugAvailable || photoUploading"
      (click)="submitJoin(draft)">
      @if (joinStatus === 'loading' && !editing) { <span class="amb-create-spinner" aria-hidden="true"></span> }
      {{ joinStatus === 'loading' ? (editing ? 'שומר…' : 'יוצר דף שגריר…') : editing ? 'שמירת שינויים' : 'יצירת דף השגריר שלי' }}
    </button>
  </app-ambassador-form-drawer>
}
