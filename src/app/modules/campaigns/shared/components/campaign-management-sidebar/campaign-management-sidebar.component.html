<button #menuTrigger type="button" aria-controls="campaign-workspace-nav" class="cms-mobile-bar" (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen">
  <app-icon name="list" />
  <span class="cms-mobile-label">ניהול קמפיין</span>
</button>
@if (mobileOpen) {
  <button type="button" class="cms-backdrop" tabindex="-1" aria-label="סגירת תפריט" (click)="closeMobile(); menuTrigger.focus()"></button>
}
<nav id="campaign-workspace-nav" (keydown.escape)="closeMobile(); menuTrigger.focus()" class="cms-sidebar" [class.cms-sidebar--mobile-open]="mobileOpen" aria-label="סביבת הקמפיין">
  <span class="cms-workspace-label">סביבת הקמפיין</span>
  @for (item of items; track item.path) {
    @if ((!item.race || isRace) && (!item.full || !isMinimalFormat)) {
      <a class="cms-item" [routerLink]="['/campaigns', campaignId, item.path]"
        routerLinkActive="cms-item--active" ariaCurrentWhenActive="page" (click)="closeMobile()">
        <app-icon [name]="item.icon" /> {{ item.label }}
      </a>
    }
  }
</nav>
