@if (part === 'headingStyle') {
<div class="editor-row" style="margin-top:10px">
  <label class="editor-label">עיצוב הכותרת</label>
  <app-text-style-editor
    [textStyle]="richTextHeadingStyle(block)"
    (textStyleChange)="updateRichTextHeadingStyle(block.id, $event)"
    [showPosition]="false"
    [showCta]="false">
  </app-text-style-editor>
</div>
} @else {
<div class="editor-field">
  <app-rich-text-editor
    [ngModel]="asRichText(block.data).content"
    (ngModelChange)="updateRichText(block.id, $event)"
    placeholder="כתבו כאן...">
  </app-rich-text-editor>
  <div class="spacing-row" style="margin-top:10px">
    <span class="spacing-label">מרווח שורות</span>
    <input type="range" class="split-slider" min="1" max="3" step="0.1"
      [value]="asRichText(block.data).lineHeight || 1.6"
      (input)="updateRichTextLineHeight(block.id, +$any($event.target).value)">
    <span class="spacing-val">{{ (asRichText(block.data).lineHeight || 1.6) | number:'1.1-1' }}</span>
  </div>
</div>
}
