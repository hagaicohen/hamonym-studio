<div class="summary-controls" data-summary-editor>
<div class="presets"><button *ngFor="let p of presets" type="button" [attr.data-summary-preset-choice]="p" [attr.aria-pressed]="(config.preset||'classic')===p" (click)="preset(p)"><span class="miniature" [attr.data-preset]="p" aria-hidden="true"></span>{{('studio.summary.'+p)|transloco}}</button></div>
<ng-container *ngIf="tab==='content'"><label>{{'studio.summary.heading'|transloco}}<input data-summary-heading [ngModel]="config.heading" (ngModelChange)="patch({heading:$event})"></label><label>{{'studio.summary.targetLabel'|transloco}}<input data-summary-target-label [ngModel]="config.targetLabel" (ngModelChange)="patch({targetLabel:$event})"></label><div class="visibility"><label *ngFor="let v of visibility"><input type="checkbox" [checked]="show(v)" (change)="setShow(v,$any($event.target).checked)">{{('studio.summary.show'+v)|transloco}}</label></div><p class="hint">{{'studio.summary.dataBound'|transloco}}</p></ng-container>
<ng-container *ngIf="tab==='design'"><label>{{'studio.summary.selectedPart'|transloco}}<select data-summary-style-part [(ngModel)]="part"><option *ngFor="let p of ['heading','amount','target','percent']" [value]="p">{{('studio.summary.part_'+p)|transloco}}</option></select></label><app-text-role-editor [roleLabel]="'studio.workspace.typography'|transloco" [override]="style" (overrideChange)="setStyle($event)"/><app-color-picker [value]="config.fill||'#6236ed'" [label]="'builder.enhance.fill'|transloco" (valueChange)="patch({fill:$event})"/><app-color-picker [value]="config.track||'#e2e8f0'" [label]="'builder.enhance.track'|transloco" (valueChange)="patch({track:$event})"/><label>{{'builder.enhance.height'|transloco}}<input data-summary-height type="range" min="8" max="48" [ngModel]="config.height??14" (ngModelChange)="patch({height:+$event})"></label><details><summary>{{'studio.summary.badgeDesign'|transloco}}</summary><app-color-picker [value]="config.badgeColor||config.fill||'#6236ed'" [label]="'studio.summary.badgeColor'|transloco" (valueChange)="patch({badgeColor:$event})"/><app-color-picker [value]="config.badgeTextColor||'#ffffff'" [label]="'builder.enhance.textColor'|transloco" (valueChange)="patch({badgeTextColor:$event})"/><app-color-picker [value]="config.badgeBorder||'#ffffff'" [label]="'builder.enhance.borderColor'|transloco" (valueChange)="patch({badgeBorder:$event})"/><label>{{'studio.summary.badgeSize'|transloco}}<input type="range" min="32" max="80" [ngModel]="config.badgeSize??56" (ngModelChange)="patch({badgeSize:+$event})"></label><label><input type="checkbox" [ngModel]="config.badgeShadow" (ngModelChange)="patch({badgeShadow:$event})">{{'builder.enhance.shadow'|transloco}}</label><label>{{'builder.enhance.radius'|transloco}}<input type="range" min="0" max="32" [ngModel]="config.radius??20" (ngModelChange)="patch({radius:+$event})"></label></details></ng-container>
<ng-container *ngIf="tab==='layout'"><label>{{'editors.ui.alignment'|transloco}}<select [ngModel]="config.align||'center'" (ngModelChange)="patch({align:$event})"><option value="start">{{'builder.amounts.alignRight'|transloco}}</option><option value="center">{{'studio.visual.center'|transloco}}</option><option value="end">{{'builder.amounts.alignLeft'|transloco}}</option></select></label><div *ngFor="let p of order;let i=index" class="reorder"><span>{{('studio.summary.part_'+p)|transloco}}</span><span><button type="button" [disabled]="i===0" [attr.aria-label]="'studio.visual.moveUp'|transloco" (click)="move(i,-1)">↑</button><button type="button" [disabled]="i===order.length-1" [attr.aria-label]="'studio.visual.moveDown'|transloco" (click)="move(i,1)">↓</button></span></div></ng-container>
<ng-container *ngIf="tab==='effects'"><label *ngFor="let key of ['animateTrack','animateAmount','animatePercent']"><input type="checkbox" [ngModel]="$any(config)[key]" (ngModelChange)="setOption(key,$event)">{{('studio.summary.'+key)|transloco}}</label><label>{{'builder.enhance.duration'|transloco}}<input data-summary-duration type="range" min="200" max="5000" step="100" [ngModel]="config.duration??1800" (ngModelChange)="patch({duration:+$event})"></label><label>{{'builder.enhance.easing'|transloco}}<select [ngModel]="config.easing||'ease-out'" (ngModelChange)="patch({easing:$event})"><option value="ease-out">{{'builder.enhance.easeOut'|transloco}}</option><option value="linear">{{'builder.enhance.linear'|transloco}}</option></select></label><label><input type="checkbox" [ngModel]="config.reanimate" (ngModelChange)="patch({reanimate:$event})">{{'studio.summary.reanimate'|transloco}}</label><button type="button" data-summary-preview (click)="preview()">{{'studio.summary.preview'|transloco}}</button><p class="hint">{{'studio.visual.reducedMotion'|transloco}}</p></ng-container>
</div>
