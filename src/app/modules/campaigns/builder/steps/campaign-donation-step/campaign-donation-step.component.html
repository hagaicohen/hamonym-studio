<div class="step-container">

  <div class="step-header">
    <div class="step-icon-wrap">💳</div>
    <div>
      <h2 class="step-title">הגדרות תרומה</h2>
      <p class="step-subtitle">סכומים מוצעים ופרטי התורם</p>
    </div>
  </div>

  <!-- ── SUGGESTED AMOUNTS ── -->
  <div class="section-card">
    <div class="section-title">סכומי תרומה מוצעים</div>

    <label class="field-toggle" [class.field-toggle--on]="draft.enableSuggestedAmounts">
      <div class="field-toggle-info">
        <span class="field-toggle-name">הצג סכומים מוצעים</span>
        <span class="field-toggle-desc">כפתורי בחירה מהירה לתורם</span>
      </div>
      <div class="toggle-switch" (click)="patchDraft({ enableSuggestedAmounts: !draft.enableSuggestedAmounts })">
        <div class="toggle-thumb"></div>
      </div>
    </label>

    <div *ngIf="draft.enableSuggestedAmounts">
      <div class="amounts-grid">
        <div class="amount-chip" *ngFor="let a of draft.suggestedAmounts; let i = index">
          <span class="amount-currency">₪</span>
          <input type="number" class="amount-input" [value]="a" min="1"
            (change)="updateAmount(i, +$any($event.target).value)">
          <button class="amount-remove" *ngIf="draft.suggestedAmounts.length > 1"
            (click)="removeAmount(i)">✕</button>
        </div>
        <button class="amount-add-btn" *ngIf="draft.suggestedAmounts.length < 6"
          (click)="addAmount()">+ הוסף</button>
      </div>
    </div>

    <label class="field-toggle" [class.field-toggle--on]="draft.allowCustomAmount">
      <div class="field-toggle-info">
        <span class="field-toggle-name">אפשר סכום חופשי</span>
        <span class="field-toggle-desc">התורם יכול להקליד כל סכום</span>
      </div>
      <div class="toggle-switch" (click)="patchDraft({ allowCustomAmount: !draft.allowCustomAmount })">
        <div class="toggle-thumb"></div>
      </div>
    </label>
  </div>

  <!-- ── MONTHLY DONATION ── -->
  <div class="section-card">
    <div class="section-title">תרומה חודשית</div>

    <label class="field-toggle" [class.field-toggle--on]="draft.allowMonthlyDonation">
      <div class="field-toggle-info">
        <span class="field-toggle-name">אפשר תרומה חודשית</span>
        <span class="field-toggle-desc">התורם יכול להתחייב לסכום חודשי קבוע</span>
      </div>
      <div class="toggle-switch" (click)="patchDraft({ allowMonthlyDonation: !draft.allowMonthlyDonation })">
        <div class="toggle-thumb"></div>
      </div>
    </label>

    <div *ngIf="draft.allowMonthlyDonation">
      <p class="amounts-sub-label">סכומים חודשיים מוצעים</p>
      <div class="amounts-grid">
        <div class="amount-chip" *ngFor="let a of draft.monthlyAmounts; let i = index">
          <span class="amount-currency">₪</span>
          <input type="number" class="amount-input" [value]="a" min="1"
            (change)="updateMonthlyAmount(i, +$any($event.target).value)">
          <button class="amount-remove" *ngIf="draft.monthlyAmounts.length > 1"
            (click)="removeMonthlyAmount(i)">✕</button>
        </div>
        <button class="amount-add-btn" *ngIf="draft.monthlyAmounts.length < 6"
          (click)="addMonthlyAmount()">+ הוסף</button>
      </div>

      <p class="amounts-sub-label">מספר תשלומים</p>
      <div class="billing-mode-grid">
        <label class="billing-mode-option" [class.billing-mode-option--on]="draft.recurringBillingMode !== 'fixed_installments'">
          <input type="radio" name="recurringBillingMode"
            [checked]="draft.recurringBillingMode !== 'fixed_installments'"
            (change)="patchDraft({ recurringBillingMode: 'until_cancelled' })">
          <span>עד לביטול</span>
        </label>
        <label class="billing-mode-option" [class.billing-mode-option--on]="draft.recurringBillingMode === 'fixed_installments'">
          <input type="radio" name="recurringBillingMode"
            [checked]="draft.recurringBillingMode === 'fixed_installments'"
            (change)="patchDraft({ recurringBillingMode: 'fixed_installments' })">
          <span>מספר תשלומים קבוע</span>
        </label>
      </div>
      <div class="installments-count-wrap" *ngIf="draft.recurringBillingMode === 'fixed_installments'">
        <label class="installments-count-label">מספר תשלומים כולל (כולל התשלום הראשון)</label>
        <input type="number" class="installments-count-input" min="1"
          [value]="draft.recurringInstallmentsCount"
          (change)="updateInstallmentsCount(+$any($event.target).value)">
      </div>
    </div>
  </div>

  <!-- ── DONOR FIELDS ── -->
  <div class="section-card">
    <div class="section-title">שדות חובה</div>
    <p class="section-desc">השדות הבאים תמיד יופיעו בטופס התורם ואינם ניתנים לשינוי:</p>
    <div class="fields-list">
      <div class="field-row field-row--required">
        <span class="field-check">✓</span>
        <span class="field-name">שם מלא</span>
        <span class="field-badge">חובה</span>
      </div>
      <div class="field-row field-row--required">
        <span class="field-check">✓</span>
        <span class="field-name">כתובת אימייל</span>
        <span class="field-badge">חובה</span>
      </div>
      <div class="field-row field-row--required">
        <span class="field-check">✓</span>
        <span class="field-name">מספר טלפון</span>
        <span class="field-badge">חובה</span>
      </div>
    </div>
  </div>

  <!-- Optional donor fields (address/postal code/ID number) are
       intentionally NOT configurable here for v1 -- donorFields is read by
       the checkout modal, but nothing in the Builder/Workspace save path
       ever persists a manager's toggle here (campaign-api.service.ts's
       toSnake() never sends donor_fields, and no such column exists on
       campaigns), so this control looked real but silently did nothing.
       Remove this comment and re-add the toggle UI once donor_fields is
       actually wired through create/update and the DB schema. -->

</div>
