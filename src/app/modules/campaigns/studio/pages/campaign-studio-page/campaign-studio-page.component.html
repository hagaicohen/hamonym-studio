<div class="load-error-state" *ngIf="loadErrorMessage">
  <p class="load-error-text">⚠ {{ loadErrorMessage }}</p>
  <button type="button" class="load-error-btn" (click)="goBack()">לרשימת הקמפיינים</button>
</div>

<ng-container *ngIf="!loadErrorMessage && (ui.state$ | async) as s">
<div class="studio-page"
  [class.studio-page--mobile]="s.device === 'mobile'"
  [class.studio-page--fullscreen]="s.fullscreen">

  <app-campaign-studio-topbar />

  <div class="studio-workspace">

    <div class="editor-card" [class.editor-card--hidden]="s.fullscreen">
      <app-campaign-editor />
    </div>

    <div class="preview-card">
      <div class="preview-inner" [class.preview-inner--mobile]="s.device === 'mobile'">
        <app-campaign-preview />
      </div>
    </div>

  </div>
</div>

<!-- Preset picker overlay — shown first when creating a new campaign -->
<app-campaign-preset-picker
  *ngIf="showPresetPicker"
  (presetSelected)="onPresetSelected($event)">
</app-campaign-preset-picker>

<!-- Template picker overlay — shown after the preset is chosen -->
<app-template-picker
  *ngIf="showTemplatePicker"
  (templateSelected)="onTemplateSelected($event)"
  (skipped)="onTemplateSkipped()">
</app-template-picker>

</ng-container>
