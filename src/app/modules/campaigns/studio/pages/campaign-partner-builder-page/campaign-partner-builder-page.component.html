<div class="cpb-load-state" *ngIf="loading">טוען את תוכן ההשתתפות...</div>

<div class="cpb-load-state cpb-load-state--error" *ngIf="loadError">⚠ {{ loadError }}</div>

<ng-container *ngIf="ui.state$ | async as s">
<div class="cpb-page" [class.cpb-page--fullscreen]="s.fullscreen" *ngIf="!loading && !loadError">
  <div class="cpb-topbar">
    <div class="cpb-topbar-title">
      <button type="button" class="cpb-back-button" *ngIf="s.fullscreen" (click)="ui.setFullscreen(!s.fullscreen)">
        <lucide-icon [img]="ArrowRight" [size]="16"></lucide-icon>
        חזרה לעריכה
      </button>
      <ng-container *ngIf="!s.fullscreen">
        <span class="cpb-title">עריכת תוכן ההשתתפות בקמפיין</span>
        <span class="cpb-subtitle">{{ partnerDisplayName }} × {{ campaignTitle }}</span>
      </ng-container>
    </div>

    <!-- CENTER: device + fullscreen switcher — same cluster/icons as
         campaign-studio-topbar.component, for full parity with the main
         campaign Builder and the Partner Profile Builder. -->
    <div class="cpb-device-switch">
      <button type="button" class="cpb-device-btn" [class.active]="s.device === 'desktop'" (click)="ui.setDevice('desktop')" title="דסקטופ">
        <lucide-icon [img]="Monitor" [size]="16"></lucide-icon>
      </button>
      <button type="button" class="cpb-device-btn" [class.active]="s.device === 'mobile'" (click)="ui.setDevice('mobile')" title="מובייל">
        <lucide-icon [img]="Smartphone" [size]="16"></lucide-icon>
      </button>
      <div class="cpb-device-divider"></div>
      <button type="button" class="cpb-device-btn" [class.active]="s.fullscreen" (click)="ui.setFullscreen(!s.fullscreen)" title="תצוגה מלאה">
        <lucide-icon [img]="s.fullscreen ? Minimize2 : Maximize2" [size]="16"></lucide-icon>
      </button>
    </div>

    <div class="cpb-topbar-actions" *ngIf="!s.fullscreen">
      <a class="cpb-icon-btn" [routerLink]="['/partners', partnerEntityId, 'builder']" target="_blank" rel="noopener" title="פרופיל השותף">
        <lucide-icon [img]="User" [size]="16"></lucide-icon>
      </a>
      <a class="cpb-icon-btn" [routerLink]="['/partners', partnerEntityId, 'view']" [queryParams]="{ campaignSlug, campaignTitle }" target="_blank" rel="noopener" title="צפייה בדף המורכב">
        <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
      </a>
      <button type="button" class="cpb-icon-btn cpb-icon-btn--save" [class.cpb-icon-btn--saved]="saved" [disabled]="saving" (click)="save()" [title]="saving ? 'שומר...' : (saved ? 'נשמר' : 'שמירה')">
        <lucide-icon *ngIf="saving" [img]="LoaderCircle" [size]="16" class="cpb-spin"></lucide-icon>
        <lucide-icon *ngIf="!saving && saved" [img]="Check" [size]="16"></lucide-icon>
        <lucide-icon *ngIf="!saving && !saved" [img]="Save" [size]="16"></lucide-icon>
      </button>
      <a class="cpb-icon-btn" [routerLink]="['/partners']" title="יציאה לרשימת השותפים">
        <lucide-icon [img]="House" [size]="16"></lucide-icon>
      </a>
    </div>
  </div>

  <div class="cpb-workspace" (window:mousemove)="ui.onResizeMove($event)" (window:mouseup)="ui.stopResize()">
    <div class="cpb-editor-card" [class.cpb-editor-card--hidden]="s.fullscreen" [style.width.px]="s.fullscreen ? null : ui.editorWidth">
      <app-campaign-page-builder-step />
    </div>
    <div class="cpb-resizer" *ngIf="!s.fullscreen" (mousedown)="ui.startResize($event)"></div>
    <div class="cpb-preview-card" [class.cpb-preview-card--mobile]="s.device === 'mobile'">
      <div class="cpb-campaign-banner" *ngIf="campaignCoverImageUrl" [style.backgroundImage]="'url(' + campaignCoverImageUrl + ')'">
        <div class="cpb-campaign-banner-scrim"></div>
        <img *ngIf="campaignEntityLogo" [src]="campaignEntityLogo" alt="" class="cpb-campaign-banner-logo" />
        <span class="cpb-campaign-banner-title">{{ campaignTitle }}</span>
      </div>
      <app-campaign-preview />
    </div>
  </div>
</div>
</ng-container>
