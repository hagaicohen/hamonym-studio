<label class="hw-field"><span class="hw-label">{{title}} @if (required) { <span class="hw-required" aria-hidden="true">*</span> }</span><input [id]="fieldId" [attr.aria-required]="required" [attr.aria-invalid]="!!error" [attr.aria-describedby]="error ? fieldId + '-error' : null" [attr.data-money]="isMoney ? '1' : null" [attr.inputmode]="isMoney ? 'numeric' : null" [type]="type" [value]="displayValue" (input)="onInput($event)" [placeholder]="placeholder" [attr.min]="type === 'number' ? 1 : null">@if (error) {<small class="hw-field-error" [id]="fieldId + '-error'">{{error}}</small>} @else if (help) {<small>{{help}}</small>}</label>
