<label class="hw-field"><span class="hw-label">תיאור קצר של הקמפיין <span class="hw-required" aria-hidden="true">*</span></span><textarea #d id="campaignDescription" aria-required="true" [attr.aria-invalid]="!!error" [attr.aria-describedby]="error ? 'campaignDescription-error' : null" (input)="descriptionChange.emit(d.value)" rows="3" placeholder="מה המטרה שלנו, למי היא עוזרת ולמה חשוב להשתתף?" [value]="description"></textarea>@if (error) { <small id="campaignDescription-error" class="hw-field-error">{{error}}</small> } @else { <small>כמה שורות בלבד. את הסיפור המלא נכתוב בשלב הבא.</small> }</label>
