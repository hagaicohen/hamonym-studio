<section class="hw-form-card hw-kind-card"><div class="hw-card-head"><span class="hw-card-symbol">★</span><div><strong>איזה קמפיין מקימים?</strong><small>אפשר להחליף סוג גם בהמשך, בלי למחוק פרטים או הרשמות.</small></div></div><div class="hw-kind-options" role="group" aria-label="בחירת סוג קמפיין"><button *ngFor="let item of kinds" type="button" [attr.data-hw-kind]="item.key" class="hw-kind-option" [class.selected]="kind === item.key" [attr.aria-pressed]="kind === item.key" (click)="choose(item.key)"><span class="hw-kind-radio" aria-hidden="true">{{kind === item.key ? '✓' : ''}}</span><span class="hw-kind-text"><strong>{{item.title}}</strong><small>{{item.desc}}</small></span></button></div><p *ngIf="kind === 'race'" class="hw-kind-note">בסיום האשף, ״ניהול מירוץ״ יאפשר להגדיר מקצים, מחירים, חולצות ומשתתפים.</p></section>
