<div class="reset-page">
  <div class="reset-card">
    <img src="/logo.png" alt="Hamonym" class="logo" />

    @if (success) {
      <h1 class="title">הסיסמה עודכנה בהצלחה</h1>
      <p class="subtitle">אפשר להתחבר עכשיו עם הסיסמה החדשה</p>
      <button class="submit-btn" (click)="goToLogin()">מעבר להתחברות</button>
    } @else if (!token) {
      <h1 class="title">קישור לא תקין</h1>
      <p class="subtitle">הקישור חסר או שגוי. יש לפנות למנהל הפלטפורמה לקבלת קישור חדש.</p>
      <a class="submit-btn" routerLink="/login">חזרה להתחברות</a>
    } @else {
      <h1 class="title">איפוס סיסמה</h1>
      <p class="subtitle">בחרו סיסמה חדשה לחשבון שלכם</p>

      <form class="reset-form" (ngSubmit)="submit()">
        <div class="field">
          <label>סיסמה חדשה</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="לפחות 8 תווים" autocomplete="new-password" />
        </div>

        <div class="field">
          <label>אימות סיסמה</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading">
          {{ loading ? 'מעדכן...' : 'עדכון סיסמה' }}
        </button>

        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }
      </form>
    }
  </div>
</div>
