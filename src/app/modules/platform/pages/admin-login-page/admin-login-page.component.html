<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-badge">ניהול פלטפורמה</div>
    <h1 class="title">כניסת מנהל מערכת</h1>
    <p class="subtitle">גישה מוגבלת לצוות הפלטפורמה בלבד</p>

    <form class="admin-login-form" (ngSubmit)="submit()">
      <div class="field">
        <label>כתובת אימייל</label>
        <input type="email" [(ngModel)]="email" name="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label>סיסמה</label>
        <div class="password-input-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-password-btn"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'הסתר סיסמה' : 'הצג סיסמה'"
          >
            @if (showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.6 18.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        @if (loading) {
          <span class="btn-spinner"></span>
          <span>מתחבר...</span>
        } @else {
          <span>כניסה</span>
        }
      </button>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }
    </form>
  </div>
</div>
