<div class="plat-page sa-v1 cm-v7">
  <header class="sa-heading">
    <div><h1>הגדרות חיוב לעמותה</h1><p class="sa-description">{{ displayName || 'עמותה' }}</p></div>
    <a class="cm-button" routerLink="/platform/collection-ops">חזרה לעמלות וגבייה</a>
  </header>

  @if (entityId) {
    <app-billing-entity-setup
        [entityId]="entityId"
        [displayNameHint]="displayName"
        [donationCountHint]="donationCount"
        [grossAmountHint]="grossAmount"
    ></app-billing-entity-setup>
  } @else {
    <div class="plat-card"><div class="plat-error">לא צוינה עמותה להגדרת חיוב</div></div>
  }
</div>
