<div class="plat-page">
  <a class="bs-back" [routerLink]="['/platform/billing-ops']">→ חזרה לתפעול חיוב</a>

  <div class="plat-header">
    <h1 class="plat-title">הגדרות חיוב — {{ displayName || 'עמותה' }}</h1>
  </div>

  @if (entityId) {
    <div class="plat-card">
      <app-billing-entity-setup
        [entityId]="entityId"
        [displayNameHint]="displayName"
        [donationCountHint]="donationCount"
        [grossAmountHint]="grossAmount"
      ></app-billing-entity-setup>
    </div>
  } @else {
    <div class="plat-card"><div class="plat-error">לא צוינה עמותה להגדרת חיוב</div></div>
  }
</div>
