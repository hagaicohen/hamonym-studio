<app-topbar [publicPage]="true" />
<div class="welcome-page">

  <div class="welcome-content">

    <h1 class="welcome-title">
      ברוכים הבאים{{ userName ? ' ' + userName : '' }}
    </h1>
    <p class="welcome-subtitle">מה תרצה לעשות?</p>

    <div class="welcome-cards">
      <button
        *ngFor="let card of cards"
        class="welcome-card"
        (click)="select(card)"
      >
        <span class="card-icon" aria-hidden="true">
          <lucide-icon [img]="card.icon" [size]="iconSize" [strokeWidth]="iconStroke"></lucide-icon>
        </span>
        <div class="card-text">
          <span class="card-title">{{ card.title }}</span>
          <span class="card-description">{{ card.description }}</span>
        </div>
        <lucide-icon class="card-arrow" [img]="ChevronLeft" [size]="arrowSize" [strokeWidth]="iconStroke" aria-hidden="true"></lucide-icon>
      </button>
    </div>

  </div>

</div>
